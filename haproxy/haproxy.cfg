global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s
    timeout tunnel  1h          # keeps idle WebSockets open

resolvers docker
    nameserver dns1 127.0.0.11:53   # Docker's internal DNS

frontend public
    bind :8080
    default_backend chat

frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s

backend chat
    balance leastconn           # new socket → instance with fewest open sockets
    option httpchk GET /healthz
    http-check expect status 200
    server chat1 chat1:8000 check resolvers docker init-addr libc,none
    server chat2 chat2:8000 check resolvers docker init-addr libc,none
